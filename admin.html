<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Admin Panel | Success Coaching Centre</title>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--neon-purple); text-align: center;">ADMIN</h2>
        <a href="admin.html" class="nav-link active">Control Panel</a>
        <a href="dashboard.html" class="nav-link">Back to Student Hub</a>
    </div>

    <div class="main-content">
        <h1>Admin Control Panel</h1>
        
        <div class="card">
            <h3>Upload New Note</h3>
            <input type="text" id="note-title" placeholder="Note Title (e.g., Maths Basics)" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0a0b10; border: 1px solid #333; color: white; border-radius: 5px;">
            <input type="text" id="note-url" placeholder="PDF Link (URL)" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0a0b10; border: 1px solid #333; color: white; border-radius: 5px;">
            <button id="upload-btn" class="btn-get-started" style="border: none; cursor: pointer; width: 100%;">Upload Note</button>
        </div>

        <div class="card">
            <h3>Manage Users</h3>
            <p>Total Registered Students: 124</p>
            <button class="btn-get-started" style="background: var(--neon-purple); border: none;">View All</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/admin-logic.js"></script>

</body>
</html>
